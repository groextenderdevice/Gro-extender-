<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GRO Extender — Premium Store</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root{--bg:#07090d;--card:#10131a;--gold:#d9a84e;--gold2:#f2c76d;--white:#f8fafc;--muted:#8d96a6;--line:rgba(255,255,255,.09);--green:#39d98a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 90% 0%,rgba(217,168,78,.08),transparent 35%),var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
button{cursor:pointer}

/* HEADER */
.header{height:70px;background:rgba(7,9,13,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:999}
.logo{font-size:28px;font-weight:1000;letter-spacing:-1px}
.logo span{color:var(--gold)}
.cart-icon{position:absolute;right:20px;top:15px;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#11141b;color:#fff;font-size:20px}

/* HERO */
.hero{max-width:1200px;margin:auto;padding:50px 20px 30px;text-align:center}
.hero h1{font-size:clamp(36px,5vw,56px);margin-bottom:12px;letter-spacing:-2px}
.hero h1 span{color:var(--gold2)}
.hero p{color:var(--muted);font-size:14px;max-width:500px;margin:auto}

/* PRODUCTS GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;max-width:1200px;margin:auto;padding:20px}
.card{background:linear-gradient(180deg,#131720,#0d1016);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.3s}
.card:hover{transform:translateY(-5px);border-color:rgba(217,168,78,.3);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card img{width:100%;height:320px;object-fit:contain;background:radial-gradient(circle,#1f2530,#10131a 60%);padding:15px;transition:.4s}
.card:hover img{transform:scale(1.05)}
.card-body{padding:20px}
.card h3{font-size:20px;margin-bottom:8px}
.card p{color:var(--muted);font-size:12px;line-height:1.7;margin-bottom:15px;min-height:35px}
.price-row{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.price{font-size:24px;font-weight:1000;color:var(--gold2)}
.old{color:#69717e;text-decoration:line-through;font-size:11px}
.discount{color:var(--green);font-size:10px;font-weight:1000;background:rgba(57,217,138,.12);padding:4px 8px;border-radius:6px}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#171108;border:0;padding:13px;border-radius:10px;font-weight:1000;width:100%;font-size:12px}
.btn-outline{background:#191d26;border:1px solid var(--line);color:#fff}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:2000;padding:15px}
.modal.show{display:flex}
.modal-content{background:#0d1016;width:min(950px,100%);max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:20px;position:relative}
.close{position:absolute;right:15px;top:15px;width:40px;height:40px;background:#171a22;border:1px solid var(--line);color:#fff;border-radius:10px;font-size:22px}

/* PRODUCT DETAIL */
.detail{display:grid;grid-template-columns:1fr 1fr}
.detail-img{background:#10131a;min-height:500px;display:flex;align-items:center;justify-content:center}
.detail-img img{width:100%;height:500px;object-fit:contain;padding:25px}
.detail-info{padding:40px 35px}
.detail-info h2{font-size:34px;letter-spacing:-1px;margin-top:10px}
.detail-info p{color:var(--muted);line-height:1.8;font-size:13px;margin-top:15px}
.detail-price{color:var(--gold2);font-size:28px;font-weight:1000;margin-top:20px}
.detail-old{color:#68717e;text-decoration:line-through;font-size:12px;margin-left:10px}
.features{margin-top:20px;border:1px solid var(--line);border-radius:12px;padding:15px}
.features h4{font-size:11px;margin-bottom:10px;color:var(--muted)}
.features li{list-style:none;color:#aeb5c0;font-size:11px;padding:6px 0}
.features li::before{content:"✓";color:var(--green);margin-right:8px;font-weight:1000}
.gallery{display:flex;gap:8px;margin-top:15px;overflow:auto;padding-bottom:5px}
.gallery img{width:60px;height:60px;object-fit:contain;background:#151922;border:1px solid var(--line);border-radius:8px;cursor:pointer}

/* CART */
.cart-panel{width:min(480px,100%);margin-left:auto;height:100%;background:#0d1016;border-left:1px solid var(--line);padding:25px;overflow:auto}
.cart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.cart-item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-item img{width:70px;height:70px;object-fit:contain;background:#151922;border-radius:10px}
.cart-item h4{font-size:12px}
.cart-item p{color:var(--gold2);font-size:12px;font-weight:900;margin-top:5px}
.qty{display:flex;align-items:center;gap:7px;margin-top:8px}
.qty button{width:26px;height:26px;border:1px solid var(--line);background:#181c25;color:#fff;border-radius:6px}
.cart-total{margin-top:25px;display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid var(--line)}
.cart-total strong{font-size:22px}

/* CHECKOUT */
.checkout{padding:30px}
.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:25px}
.field{margin-bottom:12px}
.field label{display:block;color:var(--muted);font-size:10px;font-weight:1000;margin-bottom:6px;letter-spacing:1px}
.field input,.field textarea,.field select{width:100%;background:#151922;color:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;outline:none;font-size:13px}
.field textarea{min-height:90px;resize:vertical}
.payment{border:1px solid var(--line);border-radius:12px;padding:15px}
.payment h4{font-size:11px;margin-bottom:10px;color:var(--muted)}
.payment label{display:block;margin-top:9px;padding:12px;background:#151922;border:1px solid var(--line);border-radius:9px;font-size:11px;cursor:pointer}
.qr-section{margin-top:20px;padding:20px;border:1px solid var(--line);border-radius:12px;background:#11141b}
.qr-section h4{font-size:12px;margin-bottom:15px}
.qr-container{display:flex;align-items:center;gap:20px}
.qr-box{width:170px;height:170px;background:#fff;border-radius:12px;padding:10px;display:flex;justify-content:center;align-items:center}
.qr-box canvas{width:100%;height:100%}
.upi-info{flex:1}
.upi-id{font-size:15px;font-weight:1000;color:var(--gold2);margin:10px 0;padding:12px;background:#151922;border-radius:8px}
.upi-apps{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.upi-app{padding:8px 12px;background:#151922;border:1px solid var(--line);border-radius:8px;font-size:10px;font-weight:1000}
.summary{margin-top:15px;padding:18px;border:1px solid var(--line);border-radius:12px}
.summary-row{display:flex;justify-content:space-between;margin:10px 0;font-size:12px}
.summary-row.total{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}
.summary-row.total strong{font-size:20px}

/* SUCCESS */
.success{padding:60px 25px;text-align:center}
.success-icon{width:70px;height:70px;margin:auto;background:rgba(57,217,138,.12);color:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px}
.success h2{margin-top:20px;font-size:28px}
.success p{color:var(--muted);margin-top:10px;font-size:12px}
.order-box{margin:25px auto;padding:20px;background:#151922;border:1px solid var(--line);border-radius:12px;max-width:350px}
.order-box small{color:var(--muted);font-size:10px}
.order-box .oid{font-size:22px;font-weight:1000;color:var(--gold2);margin-top:6px}

/* FLOATING */
.float{position:fixed;right:20px;bottom:100px;display:flex;flex-direction:column;gap:12px;z-index:1800}
.float button{width:54px;height:54px;border-radius:50%;border:0;font-size:24px;box-shadow:0 8px 25px rgba(0,0,0,.5);transition:.3s}
.float button:hover{transform:scale(1.08)}
.wa{background:#25D366;color:#fff}
.call{background:var(--gold);color:#171108}

/* MOBILE */
@media(max-width:850px){.detail{grid-template-columns:1fr}.detail-img,.detail-img img{min-height:350px;height:350px}.hero{padding:35px 15px 20px}.grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}
@media(max-width:600px){body{padding-bottom:60px}.hero h1{font-size:38px}.grid{grid-template-columns:1fr;padding:15px}.card img{height:300px}.checkout-grid{grid-template-columns:1fr}.qr-container{flex-direction:column}.qr-box{width:150px;height:150px}.float{right:15px;bottom:75px}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">GRO<span>®</span></div>
  <button class="cart-icon" onclick="openCart()">🛒<span id="cartCount" style="position:absolute;right:-5px;top:-5px;min-width:18px;height:18px;background:var(--gold);color:#000;border-radius:50%;font-size:10px;font-weight:1000;display:flex;align-items:center;justify-content:center">0</span></button>
</div>

<div class="hero">
  <h1>PREMIUM <span>CONFIDENCE</span></h1>
  <p>Choose Your GRO Extender Configuration — Discreet & Secure</p>
</div>

<div class="grid" id="productGrid"></div>

<div class="modal" id="productModal">
  <div class="modal-content">
    <button class="close" onclick="closeProduct()">×</button>
    <div class="detail" id="productDetail"></div>
  </div>
</div>

<div class="modal" id="cartModal">
  <div class="cart-panel">
    <div class="cart-head">
      <h2>Your Cart</h2>
      <button class="close" style="position:static" onclick="closeCart()">×</button>
    </div>
    <div id="cartItems"></div>
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">₹0</strong>
    </div>
    <button class="btn" style="width:100%;margin-top:18px" onclick="openCheckout()">CHECKOUT →</button>
  </div>
</div>

<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <button class="close" onclick="closeCheckout()">×</button>
    <div class="checkout" id="checkout"></div>
  </div>
</div>

<div class="modal" id="successModal">
  <div class="modal-content">
    <div class="success">
      <div class="success-icon">✓</div>
      <h2>Order Placed!</h2>
      <p>Your order has been created successfully.</p>
      <div class="order-box">
        <small>ORDER ID</small>
        <div class="oid" id="orderID">GRO-XXXXXXXX</div>
      </div>
      <button class="btn" style="width:200px;margin-top:20px" onclick="closeSuccess()">CONTINUE SHOPPING</button>
    </div>
  </div>
</div>

<div class="float">
  <button class="call" onclick="makeCall()">📞</button>
  <button class="wa" onclick="openWA()">💬</button>
</div>

<script>
/* ================= PRODUCTS ================= */
const PRODUCTS = [
  {
    id:"ultimate",
    name:"GRO Extender® Ultimate",
    price:3249,
    old:4499,
    image:"Gemini_Generated_Image_kjvnc0kjvnc0kjvn.png",
    gallery:["Gemini_Generated_Image_kjvnc0kjvnc0kjvn.png","ProExtender-Ultimate-Straps-260x134.jpg","ProExtender-Ultimate002 (1).png"],
    desc:"Premium adjustable configuration with multiple fitting components.",
    features:["Adjustable fitting configuration","Multiple adjustment positions","Reinforced straps","Compact component design","Adult product — 18+"]
  },
  {
    id:"supreme",
    name:"GRO Extender® Supreme+",
    price:4780,
    old:5999,
    image:"Gemini_Generated_Image_unscx2unscx2unsc.png",
    gallery:["Gemini_Generated_Image_unscx2unscx2unsc.png","51QvTFiepcL._AC_AIweblab1006854,T4_FMavif_SF700,700_PQ69_.avif","Gemini_Generated_Image_bezw1nbezw1nbezw.png"],
    desc:"Premium lightweight adjustable configuration.",
    features:["Lightweight configuration","Adjustable fitting","Reinforced components","Compact design","Adult product — 18+"]
  },
  {
    id:"doubledeck",
    name:"GRO Extender® DoubleDeck",
    price:5950,
    old:6999,
    image:"Gemini_Generated_Image_bezw1nbezw1nbezw.png",
    gallery:["Gemini_Generated_Image_bezw1nbezw1nbezw.png","pro-extender-penis-enlargement-system-500x500.jpg","pro-extender-silicone-tube.webp"],
    desc:"Multi-component premium adjustable configuration.",
    features:["Multi-component configuration","Adjustable fitting positions","Reinforced straps","Compact structure","Adult product — 18+"]
  }
];

let cart = JSON.parse(localStorage.getItem("groCart") || "[]");

/* ================= RENDER PRODUCTS ================= */
function renderProducts(){
  document.getElementById("productGrid").innerHTML = PRODUCTS.map(p=>{
    let discount = Math.round((1-p.price/p.old)*100);
    return `
      <article class="card">
        <img src="${p.image}" onclick="openProduct('${p.id}')">
        <div class="card-body">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="price-row">
            <span class="price">₹${p.price.toLocaleString("en-IN")}</span>
            <span class="old">₹${p.old.toLocaleString("en-IN")}</span>
            <span class="discount">${discount}% OFF</span>
          </div>
          <button class="btn" onclick="addToCart('${p.id}')">ADD TO CART</button>
          <button class="btn btn-outline" style="margin-top:8px" onclick="openProduct('${p.id}')">VIEW DETAILS</button>
        </div>
      </article>
    `;
  }).join("");
}

/* ================= PRODUCT MODAL ================= */
function openProduct(id){
  let p = PRODUCTS.find(x=>x.id===id);
  document.getElementById("productDetail").innerHTML = `
    <div class="detail-img">
      <img src="${p.image}" id="mainImg">
    </div>
    <div class="detail-info">
      <h2>${p.name}</h2>
      <p>${p.desc}</p>
      <div class="detail-price">₹${p.price.toLocaleString("en-IN")} <span class="detail-old">₹${p.old.toLocaleString("en-IN")}</span></div>
      <div class="features">
        <h4>PRODUCT DETAILS</h4>
        <ul>${p.features.map(f=>`<li>${f}</li>`).join("")}</ul>
      </div>
      <div class="gallery">
        ${p.gallery.map(img=>`<img src="${img}" onclick="document.getElementById('mainImg').src='${img}'">`).join("")}
      </div>
      <button class="btn" style="width:100%;margin-top:18px" onclick="addToCart('${p.id}');closeProduct()">ADD TO CART</button>
      <button class="btn btn-outline" style="width:100%;margin-top:8px" onclick="addToCart('${p.id}');closeProduct();openCheckout()">BUY NOW</button>
    </div>
  `;
  document.getElementById("productModal").classList.add("show");
}
function closeProduct(){document.getElementById("productModal").classList.remove("show")}

/* ================= CART ================= */
function addToCart(id){
  let item = cart.find(x=>x.id===id);
  if(item) item.qty++;
  else cart.push({id,qty:1});
  localStorage.setItem("groCart", JSON.stringify(cart));
  updateCartCount();
  alert("Added to cart!");
}

function updateCartCount(){
  let count = cart.reduce((a,b)=>a+b.qty, 0);
  document.getElementById("cartCount").textContent = count;
}

function openCart(){
  document.getElementById("cartItems").innerHTML = cart.length ? cart.map(item=>{
    let p = PRODUCTS.find(x=>x.id===item.id);
    return `
      <div class="cart-item">
        <img src="${p.image}">
        <div>
          <h4>${p.name}</h4>
          <p>₹${p.price.toLocaleString("en-IN")} × ${item.qty}</p>
          <div class="qty">
            <button onclick="changeQty('${p.id}',-1)">−</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${p.id}',1)">+</button>
          </div>
        </div>
        <button onclick="removeItem('${p.id}')" style="background:none;border:0;color:#777;font-size:20px;">×</button>
      </div>
    `;
  }).join("") : `<div style="padding:70px 10px;text-align:center;color:var(--muted)"><div style="font-size:45px">🛒</div><h3 style="color:#fff;margin-top:12px">Your cart is empty</h3></div>`;
  document.getElementById("cartTotal").textContent = "₹"+getTotal().toLocaleString("en-IN");
  document.getElementById("cartModal").classList.add("show");
}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}

function changeQty(id,n){
  let item = cart.find(x=>x.id===id);
  if(!item) return;
  item.qty += n;
  if(item.qty <= 0) cart = cart.filter(x=>x.id!==id);
  localStorage.setItem("groCart", JSON.stringify(cart));
  updateCartCount();
  openCart();
}

function removeItem(id){
  cart = cart.filter(x=>x.id!==id);
  localStorage.setItem("groCart", JSON.stringify(cart));
  updateCartCount();
  openCart();
}

function getTotal(){
  return cart.reduce((total,item)=>{
    let p = PRODUCTS.find(x=>x.id===item.id);
    return total + p.price * item.qty;
  }, 0);
}

/* ================= CHECKOUT ================= */
function openCheckout(){
  if(!cart.length){ alert("Cart is empty!"); return; }
  closeCart();
  let total = getTotal();
  document.getElementById("checkout").innerHTML = `
    <div style="text-align:center;margin-bottom:20px">
      <h2>Secure Checkout</h2>
      <p style="color:var(--muted);font-size:12px;margin-top:5px">Complete your order details</p>
    </div>
    <div class="checkout-grid">
      <div>
        <div class="field"><label>FULL NAME</label><input id="name" placeholder="Your name"></div>
        <div class="field"><label>MOBILE NUMBER</label><input id="mobile" maxlength="15" placeholder="+91 XXXXXXXXXX"></div>
        <div class="field"><label>DELIVERY ADDRESS</label><textarea id="address" placeholder="House, street, landmark, city, pincode"></textarea></div>
      </div>
      <div>
        <div class="payment">
          <h4>PAYMENT METHOD</h4>
          <label><input type="radio" name="payment" value="cod" checked> 💵 Cash on Delivery</label>
          <label><input type="radio" name="payment" value="upi" onchange="showUPI()"> 📱 Online Payment (UPI QR Code)</label>
        </div>
        <div id="upiSection" style="display:none">
          <div class="qr-section">
            <h4>SCAN QR CODE TO PAY</h4>
            <div class="qr-container">
              <div class="qr-box" id="qrBox"></div>
              <div class="upi-info">
                <div style="color:var(--muted);font-size:10px">UPI ID</div>
                <div class="upi-id">7407792138@ybl</div>
                <div style="color:var(--muted);font-size:10px;margin-top:12px">SUPPORTED APPS</div>
                <div class="upi-apps">
                  <div class="upi-app">📱 PhonePe</div>
                  <div class="upi-app">🔵 Google Pay</div>
                  <div class="upi-app">🟠 Paytm</div>
                  <div class="upi-app">🔷 MobiKwik</div>
                </div>
                <div style="margin-top:15px;color:var(--muted);font-size:10px">
                  Paytm ID: <strong style="color:var(--gold2)">mr.manna@ptyes</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="summary">
          <div class="summary-row"><span>Items</span><span>${cart.reduce((a,b)=>a+b.qty,0)}</span></div>
          <div class="summary-row"><span>Delivery</span><span style="color:var(--green)">FREE</span></div>
          <div class="summary-row total"><strong>Total</strong><strong>₹${total.toLocaleString("en-IN")}</strong></div>
        </div>
        <button class="btn" style="width:100%;margin-top:15px" onclick="placeOrder()">PLACE ORDER →</button>
      </div>
    </div>
  `;
  document.getElementById("checkoutModal").classList.add("show");
}

function showUPI(){
  document.getElementById("upiSection").style.display = "block";
  generateQR();
}

function generateQR(){
  let amount = getTotal();
  let upiId = "7407792138@ybl";
  let name = "GRO Extender";
  let upiUrl = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;
  let qrBox = document.getElementById("qrBox");
  qrBox.innerHTML = "";
  QRCode.toCanvas(qrBox, upiUrl, {
    width: 150,
    margin: 2,
    color: { dark: "#000000", light: "#ffffff" }
  }, function(error){ if(error) console.error(error); });
}

function closeCheckout(){document.getElementById("checkoutModal").classList.remove("show")}

/* ================= PLACE ORDER ================= */
function placeOrder(){
  let name = document.getElementById("name").value.trim();
  let mobile = document.getElementById("mobile").value.trim();
  let address = document.getElementById("address").value.trim();
  if(!name || !mobile || !address){ alert("Please fill all details!"); return; }
  
  let orderId = "GRO-" + Date.now().toString().slice(-8);
  let payment = document.querySelector('input[name="payment"]:checked').value;
  
  let orders = JSON.parse(localStorage.getItem("groOrders") || "[]");
  orders.unshift({
    id: orderId,
    name: name,
    mobile: mobile,
    address: address,
    payment: payment,
    total: getTotal(),
    items: cart,
    date: new Date().toLocaleString("en-IN"),
    status: "Order Received"
  });
  localStorage.setItem("groOrders", JSON.stringify(orders));
  
  // Send WhatsApp notification
  let msg = `🔔 NEW ORDER!\n\n📦 Order ID: ${orderId}\n👤 ${name}\n📱 ${mobile}\n📍 ${address}\n💰 ₹${getTotal()}\n💳 ${payment.toUpperCase()}`;
  window.open(`https://wa.me/917407792138?text=${encodeURIComponent(msg)}`, '_blank');
  
  cart = [];
  localStorage.setItem("groCart", "[]");
  updateCartCount();
  document.getElementById("orderID").textContent = orderId;
  closeCheckout();
  document.getElementById("successModal").classList.add("show");
}

function closeSuccess(){document.getElementById("successModal").classList.remove("show")}

/* ================= FLOATING BUTTONS ================= */
function openWA(){
  window.open(`https://wa.me/917407792138?text=${encodeURIComponent("Hello, I want to know more about GRO Extender.")}`, '_blank');
}
function makeCall(){
  window.location.href = "tel:+917407792138";
}

/* ================= INIT ================= */
renderProducts();
</script>
</body>
</html>
