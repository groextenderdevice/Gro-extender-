<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
</head>
<body>

  <!-- Hidden Form Inputs Container / Form Start -->
  <form action="https://formspree.io/f/meaigbry" method="POST">

    <input type="hidden" name="subject" value="New Order Received">
    <input type="hidden" name="from_name" value="Order Form">
    <input type="hidden" id="formProduct" name="Product">
    <input type="hidden" id="formQuantity" name="Quantity">
    <input type="hidden" id="formTotal" name="Total">

    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" name="Customer_Name" required>
    </div>

    <div class="form-group">
      <label>Phone Number *</label>
      <input type="tel" name="Phone_Number" required>
    </div>

    <div class="form-group">
      <label>Full Address *</label>
      <textarea name="Address" required></textarea>
    </div>

    <div class="form-group">
      <label>Pincode / Postal Code *</label>
      <input type="text" name="Pincode" required>
    </div>

    <div class="form-group">
      <label>Country *</label>
      <select name="Country" id="custCountry">
        <option value="India" selected>India</option>
        <option value="Bangladesh">Bangladesh</option>
        <option value="Nepal">Nepal</option>
      </select>
    </div>

    <!-- Payment Method Selection -->
    <div class="payment-box">
      <label>Payment Method</label>
      <div>
        <input type="radio" id="cod" name="Payment_Method" value="COD" checked>
        <label for="cod">Cash on Delivery</label>
      </div>
      <div>
        <input type="radio" id="online" name="Payment_Method" value="Online">
        <label for="online">Online Payment</label>
      </div>
    </div>

    <button type="submit">Place Order</button>

  </form>

</body>
</html>
