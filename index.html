<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grow Extender | Choose Your Model">
  <title>Grow Extender | Choose Your Model</title>
  <style>
    :root {
      --navy: #071a36;
      --blue: #1457a6;
      --sky: #eaf2ff;
      --bg: #f5f8fc;
      --card-bg: #ffffff;
      --text: #1a2332;
      --muted: #5a6e85;
      --border: #d2e0f0;
      --accent: #25d366;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a { text-decoration: none; color: inherit; }

    /* Products Grid */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 15px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: var(--navy);
      margin-bottom: 5px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .product-img {
      width: 100%;
      height: 200px;
      object-fit: contain;
      border-radius: 8px;
      background: #fafafa;
    }
    .product-title {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0 5px;
      color: var(--navy);
    }
    .product-price {
      font-size: 20px;
      font-weight: bold;
      color: var(--blue);
      margin-bottom: 15px;
    }
    .btn-buy {
      background: var(--blue);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    .btn-buy:hover { background: var(--navy); }

    /* Modal Overlay & Form */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
    }
    .modal-content {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      max-width: 450px;
      width: 100%;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 22px;
      cursor: pointer;
      color: var(--muted);
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
    }
    .order-summary {
      background: var(--sky);
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-weight: bold;
      color: var(--navy);
    }
    .submit-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Grow Extender</h1>
      <p style="color: var(--muted);">Choose Your Model & Order Now</p>
    </div>

    <div class="product-grid">
      <!-- Product 1 -->
      <div class="product-card">
        <div>
          <img src="https://via.placeholder.com/300x200" alt="Grow Extender Basic" class="product-img">
          <div class="product-title">Grow Extender Basic</div>
          <div class="product-price">₹1,999</div>
        </div>
        <button class="btn-buy" onclick="openModal('Grow Extender Basic', 1999)">Order Now</button>
      </div>

      <!-- Product 2 -->
      <div class="product-card">
        <div>
          <img src="https://via.placeholder.com/300x200" alt="Grow Extender Pro" class="product-img">
          <div class="product-title">Grow Extender Pro</div>
          <div class="product-price">₹2,999</div>
        </div>
        <button class="btn-buy" onclick="openModal('Grow Extender Pro', 2999)">Order Now</button>
      </div>
    </div>
  </div>

  <!-- Order Modal -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 style="margin-top:0;">Order & Payment Details</h3>
      
      <div class="order-summary" id="selectedProductText">Selected: None</div>

      <!-- Completely Free Formsubmit Service Setup -->
      <form id="orderForm" action="https://formsubmit.co/groextenderdevice@gmail.com" method="POST" onsubmit="handleFormSubmit(event)">
        
        <!-- FormSubmit Hidden Settings -->
        <input type="hidden" name="_subject" value="New Order Received - Grow Extender!">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        
        <!-- Hidden Inputs for Dynamic Order Info -->
        <input type="hidden" id="formProduct" name="Product_Name">
        <input type="hidden" id="formQuantity" name="Quantity" value="1">
        <input type="hidden" id="formTotalPrice" name="Total_Price">

        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="custName" name="Customer_Name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="custPhone" name="Phone_Number" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
          <label>Delivery Address *</label>
          <textarea id="custAddress" name="Address" rows="3" placeholder="Enter full address with PIN code" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Confirm Order via WhatsApp</button>
      </form>
    </div>
  </div>

  <script>
    let currentProduct = '';
    let currentPrice = 0;

    function openModal(productName, price) {
      currentProduct = productName;
      currentPrice = price;
      document.getElementById('selectedProductText').innerText = `Selected: ${productName} (₹${price})`;
      document.getElementById('formProduct').value = productName;
      document.getElementById('formTotalPrice').value = `₹${price}`;
      document.getElementById('orderModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('orderModal').style.display = 'none';
    }

    function handleFormSubmit(event) {
      // 1. FormSubmit will automatically process the Gmail notification in background
      
      // 2. Prepare WhatsApp message
      const name = document.getElementById('custName').value;
      const phone = document.getElementById('custPhone').value;
      const address = document.getElementById('custAddress').value;

      const whatsappMsg = `*New Order Placed!*%0A%0A` +
        `*Product:* ${currentProduct}%0A` +
        `*Price:* ₹${currentPrice}%0A` +
        `--------------------------%0A` +
        `*Customer Name:* ${name}%0A` +
        `*Phone:* ${phone}%0A` +
        `*Address:* ${address}`;

      const whatsappNumber = "8145470421"; 
      const whatsappURL = `https://wa.me/${whatsappNumber}?text=${whatsappMsg}`;

      // Open WhatsApp after submitting
      setTimeout(() => {
        window.location.href = whatsappURL;
      }, 500);
    }
  </script>
</body>
</html>
